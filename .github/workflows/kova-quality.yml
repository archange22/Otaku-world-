name: KOVA quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "update/**"]

permissions:
  contents: read

concurrency:
  group: kova-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
